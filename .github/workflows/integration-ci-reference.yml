name: Integration CI reference contracts
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/scripts/wss-ci/**', '.github/workflows/integration-ci-reference.yml']
  push:
    branches: [dev, main]
    paths: ['.github/scripts/wss-ci/**', '.github/workflows/integration-ci-reference.yml']
permissions:
  contents: read
jobs:
  contracts:
    name: Integration reference contracts (${{ matrix.os }})
    env:
      WSS_CI_CHANNEL: dev
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: 17ce329d027d28942d5c65a0375c2a9a83e993e6
          path: .ci-reference/Core
          persist-credentials: false
      - run: node --test .github/scripts/wss-ci/tests/*.test.mjs
        env:
          WSS_CORE_REFERENCE: ${{ github.workspace }}/.ci-reference/Core
      - shell: pwsh
        run: |
          ./.github/scripts/wss-ci/tests/Process.Tests.ps1
          ./.github/scripts/wss-ci/tests/Evidence.Tests.ps1
