name: Selected test source contracts
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    name: Selected test source contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared restored-assets caller contract
        shell: pwsh
        run: ./.github/scripts/tests/Test-PythonRestoredAssetsCaller.ps1
      - name: Verify source and credential boundaries
        shell: pwsh
        run: |
          ./.github/scripts/tests/Test-PythonTestSource.ps1
          ./.github/scripts/tests/Test-PythonHiddenSource.ps1
          ./.github/scripts/tests/Test-PythonSelectedContext.ps1
      - name: Reject actual child mutations of parent authority and baseline
        shell: pwsh
        run: ./.github/scripts/tests/Test-SelectedParentSnapshot.ps1
      - name: Verify shared restored-assets and output hash contracts
        shell: pwsh
        run: ./.github/scripts/wss-ci/restored-assets/RestoredAssets.Tests.ps1
