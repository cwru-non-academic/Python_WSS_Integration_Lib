name: WSS conformance validation
on:
  workflow_call:
    inputs:
      role: {type: string, required: true}
      tools_sha: {type: string, required: true}
      mode: {type: string, default: committed}
      wrapper_sha: {type: string, default: ''}
      cli_sha: {type: string, default: ''}
      candidate_json: {type: string, default: ''}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: {required: false}
env:
  WSS_CI_CHANNEL: ${{ github.ref_name }}
  WSS_TARGET_ROOT: ${{ github.workspace }}/wrapper
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
permissions:
  contents: read
jobs:
  prerequisites:
    name: Resolve preflight inputs
    runs-on: windows-2022
    outputs:
      wrapper: ${{ steps.sources.outputs.wrapper }}
      cli: ${{ steps.sources.outputs.cli }}
      fixture: ${{ steps.sources.outputs.fixture }}
      sdk: ${{ steps.sources.outputs.sdk }}
    steps:
      - name: Authenticate registered reusable caller and tooling identity
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repository=switch($env:ROLE){'wrapper'{'cwru-non-academic/Python_WSS_Integration_Lib'}'cli'{'cwru-non-academic/CLI_Python_WSS_Application'}default{throw 'Unregistered reusable role.'}}
          if($env:GITHUB_REPOSITORY -cne $repository -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main') -or $env:WSS_CI_CHANNEL -cne $env:GITHUB_REF_NAME -or $env:GITHUB_REF -cne "refs/heads/$env:WSS_CI_CHANNEL"){throw 'Unregistered reusable caller/channel/event.'}
          if($env:GITHUB_WORKFLOW_REF -cne "$repository/.github/workflows/wss-preflight.yml@$env:GITHUB_REF" -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA){throw 'Reusable caller workflow/source mismatch.'}
          $ownSha=if($env:ROLE -ceq 'wrapper'){$env:WRAPPER_SHA}else{$env:CLI_SHA}
          if($ownSha -cne $env:GITHUB_SHA -or $ownSha -cnotmatch '^[a-f0-9]{40}$' -or $env:WRAPPER_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:TOOLS_SHA -cnotmatch '^[a-f0-9]{40}$'){throw 'Exact caller/product/tooling source required.'}
          if($env:ROLE -ceq 'wrapper' -and $env:TOOLS_SHA -cne $env:GITHUB_SHA){throw 'Wrapper caller must bind its own authenticated tooling source.'}
          # workflow_sha authenticates the caller only, never the reusable callee.
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.tools_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Verify immutable tooling before importing validators
        shell: pwsh
        env:
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $caller=Join-Path $env:GITHUB_WORKSPACE 'caller'
          if((& git -C $caller rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0){throw 'Caller checkout source mismatch.'}
          if(@(& git -C $caller status --porcelain --untracked-files=all --ignore-submodules=all).Count -or $LASTEXITCODE -ne 0){throw 'Caller checkout must remain clean.'}
          $expectedTools=$env:GITHUB_SHA
          if($env:GITHUB_REPOSITORY -ceq 'cwru-non-academic/CLI_Python_WSS_Application'){
              . ./caller/.github/scripts/Read-OrdinaryPythonTooling.ps1
              $expectedTools=Get-OrdinaryPythonToolsSha $caller $env:GITHUB_SHA
          }
          if($env:TOOLS_SHA -cne $expectedTools){throw 'Tooling input differs from the authenticated caller pin.'}
          $tools=Join-Path $env:GITHUB_WORKSPACE 'tools'
          if((& git -C $tools rev-parse HEAD).Trim() -cne $env:TOOLS_SHA -or $LASTEXITCODE -ne 0){throw 'Tooling checkout differs from declared immutable source.'}
          if(@(& git -C $tools status --porcelain --untracked-files=all).Count -or $LASTEXITCODE -ne 0){throw 'Tooling checkout must remain clean.'}
          . ./tools/.github/scripts/PythonContract.ps1
          . ./tools/.github/scripts/PythonProfiles/Tooling.ps1
          Assert-PythonToolingBinding $tools $env:TOOLS_SHA (Join-Path $tools '.github/python-ci.json')
      - name: Read the exact candidate wrapper contract independently of the current application pin
        if: inputs.mode == 'candidate'
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.wrapper_sha }}
          path: candidate-contract
          persist-credentials: false
      - name: Validate exact source and execution contract
        id: sources
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          MODE: ${{ inputs.mode }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ownConfig = Get-Content caller/.github/python-ci.json -Raw | ConvertFrom-Json
          $configPath = if ($env:MODE -ceq 'candidate') { 'candidate-contract/.github/python-ci.json' } else { 'caller/.github/python-ci.json' }
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($ownConfig.automated_execution -cne 'pythonnet' -or $ownConfig.dotnet_sdk -cne '9.0.316' -or $config.automated_execution -cne 'pythonnet' -or $config.dotnet_sdk -cne '9.0.316') { throw 'Unexpected automated execution contract.' }
          if ($env:ROLE -cnotin @('wrapper','cli') -or $env:MODE -cnotin @('candidate','committed')) { throw 'Invalid validation role/mode.' }
          $wrapper = $env:WRAPPER_SHA
          $cli = $env:CLI_SHA
          if ($env:MODE -ceq 'candidate') {
            if (!$ownConfig.baseline_ready -or !$config.baseline_ready) { throw 'Candidate promotion baseline approval remains pending; ordinary committed-state .NET CI is separate.' }
            if ($env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main') -or $wrapper -cnotmatch '^[0-9a-f]{40}$' -or $cli -cnotmatch '^[0-9a-f]{40}$') { throw 'Candidate preflight requires exact target source SHAs.' }
            if($env:GITHUB_REF -ceq 'refs/heads/main' -and (@($ownConfig.channels) -cnotcontains 'main' -or @($config.channels) -cnotcontains 'main')){throw 'Main candidate capability has not been adopted.'}
          } elseif ($env:ROLE -ceq 'cli') {
            $entry = git -C caller ls-tree HEAD -- external/wss-py-wrapper
            if ($LASTEXITCODE -ne 0 -or $entry -cnotmatch '^160000 commit ([0-9a-f]{40})\s+external/wss-py-wrapper$') { throw 'Exact wrapper gitlink is required.' }
            $wrapper = $Matches[1]
          }
          $ownSha = if ($env:ROLE -ceq 'wrapper') { $wrapper } else { $cli }
          if ($ownSha -cne $env:GITHUB_SHA -or $wrapper -cnotmatch '^[0-9a-f]{40}$' -or ($cli -and $cli -cnotmatch '^[0-9a-f]{40}$') -or $config.fixture_commit -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid or raced immutable source.' }
          "wrapper=$wrapper" >> $env:GITHUB_OUTPUT
          "cli=$cli" >> $env:GITHUB_OUTPUT
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
          "sdk=$($config.dotnet_sdk)" >> $env:GITHUB_OUTPUT
  candidate-platforms:
    if: inputs.mode == 'candidate'
    needs: prerequisites
    uses: ./.github/workflows/_python-platform-validation.yml
    with:
      tools_sha: ${{ inputs.tools_sha }}
      role: ${{ inputs.role }}
      wrapper_sha: ${{ needs.prerequisites.outputs.wrapper }}
      cli_sha: ${{ needs.prerequisites.outputs.cli }}
      fixture_sha: ${{ needs.prerequisites.outputs.fixture }}
      sdk: ${{ needs.prerequisites.outputs.sdk }}
      candidate_json: ${{ inputs.candidate_json }}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
  conformance:
    needs: prerequisites
    name: Shared production conformance (Python)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Authenticate registered reusable caller and tooling identity
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repository=switch($env:ROLE){'wrapper'{'cwru-non-academic/Python_WSS_Integration_Lib'}'cli'{'cwru-non-academic/CLI_Python_WSS_Application'}default{throw 'Unregistered reusable role.'}}
          if($env:GITHUB_REPOSITORY -cne $repository -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main') -or $env:WSS_CI_CHANNEL -cne $env:GITHUB_REF_NAME -or $env:GITHUB_REF -cne "refs/heads/$env:WSS_CI_CHANNEL"){throw 'Unregistered reusable caller/channel/event.'}
          if($env:GITHUB_WORKFLOW_REF -cne "$repository/.github/workflows/wss-preflight.yml@$env:GITHUB_REF" -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA){throw 'Reusable caller workflow/source mismatch.'}
          $ownSha=if($env:ROLE -ceq 'wrapper'){$env:WRAPPER_SHA}else{$env:CLI_SHA}
          if($ownSha -cne $env:GITHUB_SHA -or $ownSha -cnotmatch '^[a-f0-9]{40}$' -or $env:WRAPPER_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:TOOLS_SHA -cnotmatch '^[a-f0-9]{40}$'){throw 'Exact caller/product/tooling source required.'}
          if($env:ROLE -ceq 'wrapper' -and $env:TOOLS_SHA -cne $env:GITHUB_SHA){throw 'Wrapper caller must bind its own authenticated tooling source.'}
          # workflow_sha authenticates the caller only, never the reusable callee.
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.tools_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Verify immutable tooling before importing validators
        shell: pwsh
        env:
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $caller=Join-Path $env:GITHUB_WORKSPACE 'caller'
          if((& git -C $caller rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0){throw 'Caller checkout source mismatch.'}
          if(@(& git -C $caller status --porcelain --untracked-files=all --ignore-submodules=all).Count -or $LASTEXITCODE -ne 0){throw 'Caller checkout must remain clean.'}
          $expectedTools=$env:GITHUB_SHA
          if($env:GITHUB_REPOSITORY -ceq 'cwru-non-academic/CLI_Python_WSS_Application'){
              . ./caller/.github/scripts/Read-OrdinaryPythonTooling.ps1
              $expectedTools=Get-OrdinaryPythonToolsSha $caller $env:GITHUB_SHA
          }
          if($env:TOOLS_SHA -cne $expectedTools){throw 'Tooling input differs from the authenticated caller pin.'}
          $tools=Join-Path $env:GITHUB_WORKSPACE 'tools'
          if((& git -C $tools rev-parse HEAD).Trim() -cne $env:TOOLS_SHA -or $LASTEXITCODE -ne 0){throw 'Tooling checkout differs from declared immutable source.'}
          if(@(& git -C $tools status --porcelain --untracked-files=all).Count -or $LASTEXITCODE -ne 0){throw 'Tooling checkout must remain clean.'}
          . ./tools/.github/scripts/PythonContract.ps1
          . ./tools/.github/scripts/PythonProfiles/Tooling.ps1
          Assert-PythonToolingBinding $tools $env:TOOLS_SHA (Join-Path $tools '.github/python-ci.json')
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.prerequisites.outputs.sdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pythonnet host
        run: python -m pip install pythonnet==3.0.5
      - uses: actions/create-github-app-token@v2
        if: inputs.mode == 'candidate'
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ needs.prerequisites.outputs.wrapper }}
          path: wrapper
          token: ${{ github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: needs.prerequisites.outputs.cli != ''
        with:
          repository: cwru-non-academic/CLI_Python_WSS_Application
          ref: ${{ needs.prerequisites.outputs.cli }}
          path: cli
          token: ${{ github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ needs.prerequisites.outputs.fixture }}
          path: fixture
          token: ${{ github.token }}
          persist-credentials: false
      - name: Read locked Core guard source
        if: inputs.mode == 'candidate'
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content tools/.github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: inputs.mode == 'candidate'
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - name: Resolve exact producer candidate
        if: inputs.mode == 'candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tools/.github/scripts/PythonPromotion.ps1
          $c = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-PythonProducer $c
          ./tools/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - name: Execute canonical cases through shared production wrapper source
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ needs.prerequisites.outputs.wrapper }}
          CLI_SHA: ${{ needs.prerequisites.outputs.cli }}
        run: |
          $options = @{
            ToolsRoot = "$env:GITHUB_WORKSPACE/tools"
            ToolsSha = '${{ inputs.tools_sha }}'
            WrapperRoot = "$env:GITHUB_WORKSPACE/wrapper"
            FixtureRoot = "$env:GITHUB_WORKSPACE/fixture"
            WrapperSha = $env:WRAPPER_SHA
            ConfigPath = "$env:GITHUB_WORKSPACE/tools/.github/python-ci.json"
            OutputRoot = "$env:RUNNER_TEMP/conformance-results"
            Mode = $env:MODE
            Role = $env:ROLE
          }
          if ($env:CLI_SHA) { $options.CliRoot = "$env:GITHUB_WORKSPACE/cli"; $options.CliSha = $env:CLI_SHA }
          if ($env:MODE -ceq 'candidate') {
            $options.ArtifactRoot = "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal"
            $options.CandidatePath = "$env:RUNNER_TEMP/resolved/candidate.json"
          }
          ./tools/.github/scripts/Invoke-DotNetConformance.ps1 @options
          ./tools/.github/scripts/tests/Test-LayeredEvidence.ps1 -ResultsRoot $options.OutputRoot
      - name: Execute CLI analog and modeled commands through the production loop
        if: inputs.role == 'cli'
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/wrapper/src" + [IO.Path]::PathSeparator + "$env:GITHUB_WORKSPACE/cli/src"
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:WSS_TEST_PAYLOAD = if ($env:MODE -ceq 'candidate') { "$env:RUNNER_TEMP/conformance-results/projection" } else { "$env:GITHUB_WORKSPACE/wrapper/Cs_Libraries" }
          python cli/conformance/test_modeled_commands.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Production CLI command matrix failed.' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ inputs.mode == 'candidate' && 'python-preflight-evidence' || 'dotnet-conformance-evidence' }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/conformance-results/evidence.json
            ${{ runner.temp }}/conformance-results/results.xml
            ${{ runner.temp }}/conformance-results/dotnet.log
            ${{ runner.temp }}/conformance-results/projection.json
            ${{ runner.temp }}/conformance-results/multi/evidence.json
            ${{ runner.temp }}/conformance-results/multi/results.xml
            ${{ runner.temp }}/conformance-results/multi/dotnet.log
            ${{ runner.temp }}/conformance-results/multi/projection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/conformance-results/*.log
            ${{ runner.temp }}/conformance-results/*.xml
            ${{ runner.temp }}/conformance-results/harness/conformance-inputs.json
