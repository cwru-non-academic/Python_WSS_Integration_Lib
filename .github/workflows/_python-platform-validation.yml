name: Python candidate platform validation
on:
  workflow_call:
    inputs:
      role: {type: string, required: true}
      tools_sha: {type: string, required: true}
      wrapper_sha: {type: string, required: true}
      cli_sha: {type: string, default: ''}
      fixture_sha: {type: string, required: true}
      sdk: {type: string, required: true}
      candidate_json: {type: string, required: true}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: {required: true}
env:
  WSS_CI_CHANNEL: ${{ github.ref_name }}
  WSS_TARGET_ROOT: ${{ github.workspace }}/wrapper
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
permissions:
  contents: read
jobs:
  compatibility:
    name: ${{ inputs.role == 'wrapper' && 'Preflight compatibility' || 'CLI platform compatibility' }} (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            arch: x64
          - name: Ubuntu
            os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Authenticate registered reusable caller and tooling identity
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repository=switch($env:ROLE){'wrapper'{'cwru-non-academic/Python_WSS_Integration_Lib'}'cli'{'cwru-non-academic/CLI_Python_WSS_Application'}default{throw 'Unregistered reusable role.'}}
          if($env:GITHUB_REPOSITORY -cne $repository -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main') -or $env:WSS_CI_CHANNEL -cne $env:GITHUB_REF_NAME -or $env:GITHUB_REF -cne "refs/heads/$env:WSS_CI_CHANNEL"){throw 'Unregistered reusable caller/channel/event.'}
          if($env:GITHUB_WORKFLOW_REF -cne "$repository/.github/workflows/wss-preflight.yml@$env:GITHUB_REF" -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA){throw 'Reusable caller workflow/source mismatch.'}
          $ownSha=if($env:ROLE -ceq 'wrapper'){$env:WRAPPER_SHA}else{$env:CLI_SHA}
          if($ownSha -cne $env:GITHUB_SHA -or $ownSha -cnotmatch '^[a-f0-9]{40}$' -or $env:WRAPPER_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:TOOLS_SHA -cnotmatch '^[a-f0-9]{40}$'){throw 'Exact caller/product/tooling source required.'}
          if($env:ROLE -ceq 'wrapper' -and $env:TOOLS_SHA -cne $env:GITHUB_SHA){throw 'Wrapper caller must bind its own authenticated tooling source.'}
          # workflow_sha authenticates the caller only, never the reusable callee.
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.tools_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Verify immutable tooling before importing validators
        shell: pwsh
        env:
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $caller=Join-Path $env:GITHUB_WORKSPACE 'caller'
          if((& git -C $caller rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0){throw 'Caller checkout source mismatch.'}
          if(@(& git -C $caller status --porcelain --untracked-files=all --ignore-submodules=all).Count -or $LASTEXITCODE -ne 0){throw 'Caller checkout must remain clean.'}
          $expectedTools=$env:GITHUB_SHA
          if($env:GITHUB_REPOSITORY -ceq 'cwru-non-academic/CLI_Python_WSS_Application'){
              . ./caller/.github/scripts/Read-OrdinaryPythonTooling.ps1
              $expectedTools=Get-OrdinaryPythonToolsSha $caller $env:GITHUB_SHA
          }
          if($env:TOOLS_SHA -cne $expectedTools){throw 'Tooling input differs from the authenticated caller pin.'}
          $tools=Join-Path $env:GITHUB_WORKSPACE 'tools'
          if((& git -C $tools rev-parse HEAD).Trim() -cne $env:TOOLS_SHA -or $LASTEXITCODE -ne 0){throw 'Tooling checkout differs from declared immutable source.'}
          if(@(& git -C $tools status --porcelain --untracked-files=all).Count -or $LASTEXITCODE -ne 0){throw 'Tooling checkout must remain clean.'}
          . ./tools/.github/scripts/PythonContract.ps1
          . ./tools/.github/scripts/PythonProfiles/Tooling.ps1
          Assert-PythonToolingBinding $tools $env:TOOLS_SHA (Join-Path $tools '.github/python-ci.json')
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.sdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install build==1.2.2.post1 pythonnet==3.0.5
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.wrapper_sha }}
          path: wrapper
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.role == 'cli'
        with:
          repository: cwru-non-academic/CLI_Python_WSS_Application
          ref: ${{ inputs.cli_sha }}
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ inputs.fixture_sha }}
          path: fixture
          persist-credentials: false
      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content tools/.github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - name: Require canonical dev-push provenance and resolve the exact archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tools/.github/scripts/PythonPromotion.ps1
          $candidate = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-PythonProducer $candidate
          ./tools/.github/scripts/Resolve-WssRelease.ps1 -RunId $candidate.run_id -ExpectedArtifactId $candidate.artifact_id -ExpectedCommit $candidate.commit -ArchiveName $candidate.archive -ExpectedSha256 $candidate.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      # Use the locked Core harness, never executable code from the candidate.
      # Check the full extracted universal payload before consumer projection.
      - name: Verify Core universal package rejection fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet build workflow-guard/tools/ArtifactBuild/ArtifactBuild.csproj
          python workflow-guard/tests/Packaging/verify_universal.py "$RUNNER_TEMP/resolved/extracted/WSS-Universal"
      - name: Verify candidate package, production transport selection and native ABI
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          $options = @{
            ToolsRoot = "$env:GITHUB_WORKSPACE/tools"
            ToolsSha = '${{ inputs.tools_sha }}'
            WrapperRoot = "$env:GITHUB_WORKSPACE/wrapper"
            WrapperSha = $env:WRAPPER_SHA
            FixtureRoot = "$env:GITHUB_WORKSPACE/fixture"
            OutputRoot = "$env:RUNNER_TEMP/platform-results"
            ConfigPath = "$env:GITHUB_WORKSPACE/tools/.github/python-ci.json"
            Mode = 'candidate'
            ArtifactRoot = "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal"
            CandidatePath = "$env:RUNNER_TEMP/resolved/candidate.json"
          }
          if ($env:ROLE -ceq 'cli') { $options.CliRoot = "$env:GITHUB_WORKSPACE/cli"; $options.CliSha = $env:CLI_SHA }
          ./tools/.github/scripts/Invoke-PlatformCompatibility.ps1 @options
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-preflight-platform-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/platform.json
            ${{ runner.temp }}/platform-results/python-smoke.json
            ${{ runner.temp }}/platform-results/platform.trx

  macos-architectures:
    name: ${{ inputs.role == 'wrapper' && 'Preflight compatibility' || 'CLI platform compatibility' }} (${{ matrix.display }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-x64
            display: macOS Intel (x64)
            os: macos-15-intel
            arch: x64
          - name: macOS-arm64
            display: macOS Apple Silicon (arm64)
            os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WSS_EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - name: Authenticate registered reusable caller and tooling identity
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repository=switch($env:ROLE){'wrapper'{'cwru-non-academic/Python_WSS_Integration_Lib'}'cli'{'cwru-non-academic/CLI_Python_WSS_Application'}default{throw 'Unregistered reusable role.'}}
          if($env:GITHUB_REPOSITORY -cne $repository -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main') -or $env:WSS_CI_CHANNEL -cne $env:GITHUB_REF_NAME -or $env:GITHUB_REF -cne "refs/heads/$env:WSS_CI_CHANNEL"){throw 'Unregistered reusable caller/channel/event.'}
          if($env:GITHUB_WORKFLOW_REF -cne "$repository/.github/workflows/wss-preflight.yml@$env:GITHUB_REF" -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA){throw 'Reusable caller workflow/source mismatch.'}
          $ownSha=if($env:ROLE -ceq 'wrapper'){$env:WRAPPER_SHA}else{$env:CLI_SHA}
          if($ownSha -cne $env:GITHUB_SHA -or $ownSha -cnotmatch '^[a-f0-9]{40}$' -or $env:WRAPPER_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:TOOLS_SHA -cnotmatch '^[a-f0-9]{40}$'){throw 'Exact caller/product/tooling source required.'}
          if($env:ROLE -ceq 'wrapper' -and $env:TOOLS_SHA -cne $env:GITHUB_SHA){throw 'Wrapper caller must bind its own authenticated tooling source.'}
          # workflow_sha authenticates the caller only, never the reusable callee.
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.tools_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Verify immutable tooling before importing validators
        shell: pwsh
        env:
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $caller=Join-Path $env:GITHUB_WORKSPACE 'caller'
          if((& git -C $caller rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0){throw 'Caller checkout source mismatch.'}
          if(@(& git -C $caller status --porcelain --untracked-files=all --ignore-submodules=all).Count -or $LASTEXITCODE -ne 0){throw 'Caller checkout must remain clean.'}
          $expectedTools=$env:GITHUB_SHA
          if($env:GITHUB_REPOSITORY -ceq 'cwru-non-academic/CLI_Python_WSS_Application'){
              . ./caller/.github/scripts/Read-OrdinaryPythonTooling.ps1
              $expectedTools=Get-OrdinaryPythonToolsSha $caller $env:GITHUB_SHA
          }
          if($env:TOOLS_SHA -cne $expectedTools){throw 'Tooling input differs from the authenticated caller pin.'}
          $tools=Join-Path $env:GITHUB_WORKSPACE 'tools'
          if((& git -C $tools rev-parse HEAD).Trim() -cne $env:TOOLS_SHA -or $LASTEXITCODE -ne 0){throw 'Tooling checkout differs from declared immutable source.'}
          if(@(& git -C $tools status --porcelain --untracked-files=all).Count -or $LASTEXITCODE -ne 0){throw 'Tooling checkout must remain clean.'}
          . ./tools/.github/scripts/PythonContract.ps1
          . ./tools/.github/scripts/PythonProfiles/Tooling.ps1
          Assert-PythonToolingBinding $tools $env:TOOLS_SHA (Join-Path $tools '.github/python-ci.json')
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.sdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install build==1.2.2.post1 pythonnet==3.0.5
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.wrapper_sha }}
          path: wrapper
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.role == 'cli'
        with:
          repository: cwru-non-academic/CLI_Python_WSS_Application
          ref: ${{ inputs.cli_sha }}
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ inputs.fixture_sha }}
          path: fixture
          persist-credentials: false
      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content tools/.github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - name: Require canonical dev-push provenance and resolve the exact archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tools/.github/scripts/PythonPromotion.ps1
          $candidate = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-PythonProducer $candidate
          ./tools/.github/scripts/Resolve-WssRelease.ps1 -RunId $candidate.run_id -ExpectedArtifactId $candidate.artifact_id -ExpectedCommit $candidate.commit -ArchiveName $candidate.archive -ExpectedSha256 $candidate.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - name: Verify candidate package, production transport selection and native ABI
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          $options = @{
            ToolsRoot = "$env:GITHUB_WORKSPACE/tools"
            ToolsSha = '${{ inputs.tools_sha }}'
            WrapperRoot = "$env:GITHUB_WORKSPACE/wrapper"
            WrapperSha = $env:WRAPPER_SHA
            FixtureRoot = "$env:GITHUB_WORKSPACE/fixture"
            OutputRoot = "$env:RUNNER_TEMP/platform-results"
            ConfigPath = "$env:GITHUB_WORKSPACE/tools/.github/python-ci.json"
            Mode = 'candidate'
            ArtifactRoot = "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal"
            CandidatePath = "$env:RUNNER_TEMP/resolved/candidate.json"
          }
          if ($env:ROLE -ceq 'cli') { $options.CliRoot = "$env:GITHUB_WORKSPACE/cli"; $options.CliSha = $env:CLI_SHA }
          ./tools/.github/scripts/Invoke-PlatformCompatibility.ps1 @options
      - name: Record native macOS architecture worker outcome
        if: always()
        shell: pwsh
        env:
          WORKER_CONCLUSION: ${{ job.status }}
          EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'platform-results'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          . ./tools/.github/scripts/wss-ci/Evidence.ps1
          $identity=New-WssCiEvidenceIdentity $env:GITHUB_REPOSITORY $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT $env:GITHUB_SHA $env:EXPECTED_ARCHITECTURE
          @{schema='wss-macos-worker/v1';ci=$identity;architecture=$env:EXPECTED_ARCHITECTURE;conclusion=$env:WORKER_CONCLUSION;repository=$env:GITHUB_REPOSITORY;run_id=$env:GITHUB_RUN_ID;source_sha=$env:GITHUB_SHA} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $root 'outcome.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-preflight-platform-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/platform.json
            ${{ runner.temp }}/platform-results/outcome.json
            ${{ runner.temp }}/platform-results/python-smoke.json
            ${{ runner.temp }}/platform-results/platform.trx

  macos-compatibility:
    name: ${{ inputs.role == 'wrapper' && 'Preflight compatibility' || 'CLI platform compatibility' }} (macOS)
    if: always()
    needs: [macos-architectures]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate registered reusable caller and tooling identity
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repository=switch($env:ROLE){'wrapper'{'cwru-non-academic/Python_WSS_Integration_Lib'}'cli'{'cwru-non-academic/CLI_Python_WSS_Application'}default{throw 'Unregistered reusable role.'}}
          if($env:GITHUB_REPOSITORY -cne $repository -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main') -or $env:WSS_CI_CHANNEL -cne $env:GITHUB_REF_NAME -or $env:GITHUB_REF -cne "refs/heads/$env:WSS_CI_CHANNEL"){throw 'Unregistered reusable caller/channel/event.'}
          if($env:GITHUB_WORKFLOW_REF -cne "$repository/.github/workflows/wss-preflight.yml@$env:GITHUB_REF" -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA){throw 'Reusable caller workflow/source mismatch.'}
          $ownSha=if($env:ROLE -ceq 'wrapper'){$env:WRAPPER_SHA}else{$env:CLI_SHA}
          if($ownSha -cne $env:GITHUB_SHA -or $ownSha -cnotmatch '^[a-f0-9]{40}$' -or $env:WRAPPER_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:TOOLS_SHA -cnotmatch '^[a-f0-9]{40}$'){throw 'Exact caller/product/tooling source required.'}
          if($env:ROLE -ceq 'wrapper' -and $env:TOOLS_SHA -cne $env:GITHUB_SHA){throw 'Wrapper caller must bind its own authenticated tooling source.'}
          # workflow_sha authenticates the caller only, never the reusable callee.
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ inputs.tools_sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
      - name: Verify immutable tooling before importing validators
        shell: pwsh
        env:
          TOOLS_SHA: ${{ inputs.tools_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $caller=Join-Path $env:GITHUB_WORKSPACE 'caller'
          if((& git -C $caller rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or $LASTEXITCODE -ne 0){throw 'Caller checkout source mismatch.'}
          if(@(& git -C $caller status --porcelain --untracked-files=all --ignore-submodules=all).Count -or $LASTEXITCODE -ne 0){throw 'Caller checkout must remain clean.'}
          $expectedTools=$env:GITHUB_SHA
          if($env:GITHUB_REPOSITORY -ceq 'cwru-non-academic/CLI_Python_WSS_Application'){
              . ./caller/.github/scripts/Read-OrdinaryPythonTooling.ps1
              $expectedTools=Get-OrdinaryPythonToolsSha $caller $env:GITHUB_SHA
          }
          if($env:TOOLS_SHA -cne $expectedTools){throw 'Tooling input differs from the authenticated caller pin.'}
          $tools=Join-Path $env:GITHUB_WORKSPACE 'tools'
          if((& git -C $tools rev-parse HEAD).Trim() -cne $env:TOOLS_SHA -or $LASTEXITCODE -ne 0){throw 'Tooling checkout differs from declared immutable source.'}
          if(@(& git -C $tools status --porcelain --untracked-files=all).Count -or $LASTEXITCODE -ne 0){throw 'Tooling checkout must remain clean.'}
          . ./tools/.github/scripts/PythonContract.ps1
          . ./tools/.github/scripts/PythonProfiles/Tooling.ps1
          Assert-PythonToolingBinding $tools $env:TOOLS_SHA (Join-Path $tools '.github/python-ci.json')
      - uses: actions/download-artifact@v4
        with:
          pattern: python-preflight-platform-macOS-*
          path: ${{ runner.temp }}/macos-inputs
      - name: Require native Intel and Apple Silicon consumer proofs
        shell: pwsh
        env:
          MACOS_WORKER_RESULT: ${{ needs.macos-architectures.result }}
        run: |
          ./tools/.github/scripts/Complete-MacOSConsumer.ps1 -InputRoot "$env:RUNNER_TEMP/macos-inputs" -OutputRoot "$env:RUNNER_TEMP/macos-complete" -ArtifactPrefix 'python-preflight-platform' -EvidenceSubdirectory '' -WorkerResult $env:MACOS_WORKER_RESULT
      - uses: actions/upload-artifact@v4
        with:
          name: python-preflight-platform-macOS
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/macos-complete/
