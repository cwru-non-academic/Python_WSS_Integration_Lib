# INACTIVE: merge into the reviewed registered workflow only after policy adoption.
# Requires existing prerequisites outputs wrapper/cli/fixture/sdk and a
# mandatory-python-gates barrier for EVERY unchanged ordinary/candidate/native job.
# This file deliberately supplies no implementation that can fake that barrier.
jobs:
  selected-test-prerequisite:
    needs: prerequisites
    if: inputs.role == 'wrapper'
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    outputs:
      selection_id: ${{ steps.selection.outputs.selection_id }}
      test_repository: ${{ steps.selection.outputs.test_repository }}
      test_commit: ${{ steps.selection.outputs.test_commit }}
      core_commit: ${{ steps.lock.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: bootstrap
          persist-credentials: false
          submodules: false
      - name: Require actual wrapper source
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ needs.prerequisites.outputs.wrapper }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/Python_WSS_Integration_Lib' -or $env:WRAPPER_SHA -cne $env:GITHUB_SHA) { throw 'Actual wrapper run/source required.' }
      - name: Read reviewed immutable Core lock
        id: lock
        shell: pwsh
        run: |
          $lock=Get-Content bootstrap/.github/scripts/wss-ci.lock.json -Raw | ConvertFrom-Json
          if ($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)") { throw 'Invalid reviewed Core lock.' }
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/create-github-app-token@v2
        id: source-read
        with:
          app-id: ${{ inputs.wss_github_app_id }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore,Python_WSS_Integration_Lib
          permission-contents: read
          permission-actions: read
      - uses: actions/create-github-app-token@v2
        id: variables-read
        with:
          app-id: ${{ inputs.wss_github_app_id }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: Python_WSS_Integration_Lib
          permission-variables: read
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.lock.outputs.commit }}
          path: selection-core
          token: ${{ steps.source-read.outputs.token }}
          persist-credentials: false
          submodules: false
      - name: Freeze test selection once using repository-only variables
        id: prepare
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.source-read.outputs.token }}
          WSS_TEST_VARIABLE_READ_TOKEN: ${{ steps.variables-read.outputs.token }}
          WSS_CI_CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./bootstrap/.github/scripts/SelectedTestContext.ps1
          Assert-ReviewedSelectionCore "$env:GITHUB_WORKSPACE/selection-core"
          $candidate="$env:RUNNER_TEMP/selection-candidate.json"
          if ($env:MODE -ceq 'candidate') { $env:CANDIDATE_JSON | Set-Content $candidate }
          else { Copy-Item bootstrap/.github/python-candidate.json $candidate }
          node selection-core/tools/ci/ci-test-selection.mjs select python-wrapper $candidate "$env:RUNNER_TEMP/python-selection" $env:MODE
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated test selection failed.' }
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.created == 'true'
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/python-selection/context.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

      - name: Independently authenticate durable selection after upload or recovery
        id: selection
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.source-read.outputs.token }}
          WSS_CI_CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
        run: |
          node selection-core/tools/ci/ci-test-selection.mjs load python-wrapper "$env:RUNNER_TEMP/selection-candidate.json" "$env:RUNNER_TEMP/python-selection-loaded" $env:MODE
          if ($LASTEXITCODE -ne 0) { throw 'Durable selection authentication failed.' }

  selected-python-tests:
    needs: [prerequisites, selected-test-prerequisite, mandatory-python-gates]
    if: inputs.role == 'wrapper'
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    env:
      WSS_CI_CHANNEL: ${{ inputs.channel }}
      WSS_TEST_SELECTION_ID: ${{ needs.selected-test-prerequisite.outputs.selection_id }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.prerequisites.outputs.sdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pythonnet==3.0.5
      - uses: actions/create-github-app-token@v2
        id: source-read
        with:
          app-id: ${{ inputs.wss_github_app_id }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore,Python_WSS_Integration_Lib,CLI_Python_WSS_Application,CSharp_WSS_Integration_Lib
          permission-contents: read
          permission-actions: read
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: bootstrap
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ needs.selected-test-prerequisite.outputs.core_commit }}
          path: selection-core
          token: ${{ steps.source-read.outputs.token }}
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ needs.prerequisites.outputs.wrapper }}
          path: product-wrapper
          token: ${{ steps.source-read.outputs.token }}
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        if: inputs.mode == 'candidate'
        with:
          repository: cwru-non-academic/CLI_Python_WSS_Application
          ref: ${{ needs.prerequisites.outputs.cli }}
          path: product-cli
          token: ${{ steps.source-read.outputs.token }}
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.selected-test-prerequisite.outputs.test_repository }}
          ref: ${{ needs.selected-test-prerequisite.outputs.test_commit }}
          path: selected-tests
          token: ${{ steps.source-read.outputs.token }}
          persist-credentials: false
          submodules: false
      - name: Recover authenticated durable context without rereading settings
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.source-read.outputs.token }}
          MODE: ${{ inputs.mode }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./bootstrap/.github/scripts/SelectedTestContext.ps1
          Assert-ReviewedSelectionCore "$env:GITHUB_WORKSPACE/selection-core"
          $candidate="$env:RUNNER_TEMP/selection-candidate.json"
          if ($env:MODE -ceq 'candidate') { $env:CANDIDATE_JSON | Set-Content $candidate }
          else { Copy-Item product-wrapper/.github/python-candidate.json $candidate }
          $loaded=(node selection-core/tools/ci/ci-test-selection.mjs load python-wrapper $candidate "$env:RUNNER_TEMP/python-selection" $env:MODE) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $loaded.selection_id -cne $env:WSS_TEST_SELECTION_ID) { throw 'Recovered context differs from the immutable prerequisite output.' }
      - name: Declare fresh exact products and separate tests
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ needs.prerequisites.outputs.wrapper }}
          CLI_SHA: ${{ needs.prerequisites.outputs.cli }}
          MODE: ${{ inputs.mode }}
        run: |
          $products=@(@{repository='cwru-non-academic/Python_WSS_Integration_Lib';commit=$env:WRAPPER_SHA;path="$env:GITHUB_WORKSPACE/product-wrapper"})
          if ($env:MODE -ceq 'candidate') { $products+=@{repository='cwru-non-academic/CLI_Python_WSS_Application';commit=$env:CLI_SHA;path="$env:GITHUB_WORKSPACE/product-cli"} }
          # This wrapper has no gitlinks. CLI gitlinks stay uninitialized; never
          # insert a candidate wrapper into a different historical product pin.
          # Any future initialized gitlink must be declared here at its actual path
          # and indexed SHA. Core inspect rejects undeclared/dirty initialized links.
          @{selection_id=$env:WSS_TEST_SELECTION_ID;test_root="$env:GITHUB_WORKSPACE/selected-tests";products=$products} | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP/python-roots.json"
      - name: Resolve the exact existing candidate without changing product source
        if: inputs.mode == 'candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.source-read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
          WSS_TARGET_ROOT: ${{ github.workspace }}/product-wrapper
          WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/selection-core
        run: |
          . ./bootstrap/.github/scripts/PythonPromotion.ps1
          $c=$env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-PythonProducer $c
          ./bootstrap/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/selected-resolved"
      - name: Authenticate, retain baseline, execute additive selected tests, then reauthenticate evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.source-read.outputs.token }}
          MODE: ${{ inputs.mode }}
        run: |
          $options=@{CoreRoot="$env:GITHUB_WORKSPACE/selection-core";ContextPath="$env:RUNNER_TEMP/python-selection/context.json";RootsPath="$env:RUNNER_TEMP/python-roots.json";WorkRoot="$env:RUNNER_TEMP/python-selected-validation";Mode=$env:MODE}
          if ($env:MODE -ceq 'candidate') { $options.ArtifactRoot="$env:RUNNER_TEMP/selected-resolved/extracted/WSS-Universal";$options.CandidatePath="$env:RUNNER_TEMP/selected-resolved/candidate.json" }
          # The bridge strips bootstrap tokens from both suite child processes.
          ./bootstrap/.github/scripts/Invoke-SelectedPythonTestsWithContext.ps1 @options
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wss-selected-tests-python-wrapper-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-selected-validation/selection/evidence.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-selected-diagnostics-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/python-selected-validation/baseline
            ${{ runner.temp }}/python-selected-validation/selected
          if-no-files-found: warn
          retention-days: 14
